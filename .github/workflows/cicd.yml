name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. TESTES
  test:
    name: Rodar Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: pytest

  # 2. BUILD E PUSH (DOCKER)
  build-and-push:
    name: Build e Push Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/desafio-docker-fastapi:latest
            ${{ secrets.DOCKER_USERNAME }}/desafio-docker-fastapi:${{ github.sha }}

  # 3. PROVISIONAR INFRA (TERRAFORM)
  provision-infra:
    name: Provisionar Infraestrutura
    needs: test # Pode rodar enquanto o Docker builda
    runs-on: ubuntu-latest
    
    # Define as saídas para usar no próximo job
    outputs:
      server_ip: ${{ steps.get-ip.outputs.ipv4 }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        # Passamos o Token da DO via variável de ambiente TF_VAR_do_token
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: terraform apply -auto-approve

      - name: Pegar IP do Output
        id: get-ip
        working-directory: ./terraform
        run: |
          

  # 4. DEPLOY (USANDO O IP DINÂMICO)
  deploy:
    name: Deploy no Servidor
    needs: [build-and-push, provision-infra] # Espera o Build E o Servidor estarem prontos
    runs-on: ubuntu-latest
    
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # AQUI ESTÁ O PULO DO GATO: Usamos o IP que veio do Terraform!
          host: ${{ needs.provision-infra.outputs.server_ip }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |